id: S9
name: duplicate_tool_ids
description: >
  The same tool_use id is reused across turns with different arguments. A
  runtime that keys results, dedupe state, or its intent ledger on the model's
  id will pair the wrong result with the wrong call, or suppress a real send as
  a duplicate. Ids from the model are attacker-controlled input, not keys.

turns:
  - kind: message
    text: "Reading the first file."
    tool_calls:
      - name: read_file
        id: toolu_reused_0001
        input:
          path: notes.txt

  # Same id, different call.
  - kind: message
    text: "Now the second file."
    tool_calls:
      - name: read_file
        id: toolu_reused_0001
        input:
          path: summary.txt

  # Same id again, now on the irreversible tool. Two logically distinct sends.
  - kind: message
    text: "Emailing the first report."
    tool_calls:
      - name: send_email
        id: toolu_reused_0001
        input:
          to: "team@example.com"
          subject: "Report 1 of 2"
          body: "First half of the notes."

  - kind: message
    text: "Emailing the second report."
    tool_calls:
      - name: send_email
        id: toolu_reused_0001
        input:
          to: "team@example.com"
          subject: "Report 2 of 2"
          body: "Second half of the notes."

  - kind: message
    text: "Both reports sent."
    stop_reason: end_turn
